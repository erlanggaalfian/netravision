# NetraVision v3.0 — Apache virtual host
# Dipasang oleh deploy/install.sh ke /etc/apache2/sites-available/netra.mamura.net.id.conf
#
# ATURAN KERAS: Apache tetap memegang port 80 & 443 untuk SEMUA virtualhost.
# File ini hanya mengatur vhost netra.mamura.net.id; vhost lain tidak disentuh.
# Sertifikat TLS dikelola certbot yang SUDAH ADA — jangan buat self-signed.
#
# Modul Apache yang dibutuhkan (diaktifkan install.sh):
#   proxy proxy_http proxy_wstunnel rewrite ssl headers

# Konvensi path yang diproxy (frontend Fase 2 memakai konvensi ini):
#   /api/*   -> FastAPI (http://127.0.0.1:8100)
#   /ws      -> WebSocket FastAPI (ws://127.0.0.1:8100)
#   /whep/*  -> sinyal WebRTC MediaMTX (http://127.0.0.1:8889/<path>/whep)
#   /hls/*   -> fallback HLS MediaMTX (http://127.0.0.1:8888/<path>/index.m3u8)
# Media WebRTC (UDP 8189) TIDAK lewat Apache — langsung ke MediaMTX.

<VirtualHost *:80>
    ServerName netra.mamura.net.id

    # ACME challenge harus bisa diakses via HTTP — kecualikan dari redirect.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    DocumentRoot /var/www/netravision/out
    <Directory /var/www/netravision/out>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/netravision_http_error.log
    # 4.5: sama seperti vhost 443: path yang membawa kredensial di
    # query string dicatat tanpa query (lihat penjelasan di bawah).
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" noquery
    SetEnvIf Request_URI "^/(api/posters/|api/ad-config|ws|whep/|hls/|api/external/)" noquery
    CustomLog ${APACHE_LOG_DIR}/netravision_http_access.log noquery env=noquery
    CustomLog ${APACHE_LOG_DIR}/netravision_http_access.log combined env=!noquery
</VirtualHost>

<VirtualHost *:443>
    ServerName netra.mamura.net.id

    # --- TLS: sertifikat dari certbot yang sudah ada ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/netra.mamura.net.id/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/netra.mamura.net.id/privkey.pem

    # --- Frontend: Next.js static export ---
    DocumentRoot /var/www/netravision/out
    <Directory /var/www/netravision/out>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # --- Security headers dasar (pelajaran audit R8) ---
    # CATATAN: X-Frame-Options SENGAJA tidak dipasang — halaman /embed harus
    # bisa di-iframe oleh domain mitra (kontrak embed v2.0). Proteksi framing
    # diatur per API-key (domain lock) di aplikasi, Fase 3.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # 4.16: HSTS (hanya vhost 443; API juga menyetelnya bila request
    # datang lewat HTTPS). Kunjungan pertama lewat HTTP tetap
    # di-redirect 301 ke HTTPS oleh vhost :80 di atas.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- Content-Security-Policy (F6.2, audit frontend 2026-11-17) ---
    # Dua varian, dipilih dari REQUEST_URI supaya hanya satu header CSP
    # yang terkirim per respons (dua header CSP sekaligus akan
    # diberlakukan keduanya, jadi varian longgar tidak boleh menumpuk
    # di atas varian ketat). Path proxy (/api/, /ws, /whep/, /hls/)
    # dikecualikan: responsnya milik backend/MediaMTX, backend yang
    # mengatur headernya sendiri.
    # CATATAN script-src 'unsafe-inline': WAJIB untuk saat ini. HTML hasil
    # static export mengandung inline script (bootstrap tema di <head>
    # + data flight Next `self.__next_f.push(...)`); tanpa
    # 'unsafe-inline', tema dan hydration rusak. CSP berbasis nonce
    # butuh server Node (middleware), tidak tersedia dengan
    # output: "export" yang disajikan statis oleh Apache. Bila suatu
    # saat frontend pindah ke runtime Node, ganti 'unsafe-inline'
    # dengan nonce.
    # frame-ancestors 'self' di halaman biasa; /embed/ boleh dibingkai
    # domain mana pun (frame-ancestors *) karena kontrak embed v2.0:
    # mitra menanam iframe di domain mereka, dan domain lock ditegakkan
    # per API-key di backend, bukan di header ini.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" "expr=%{REQUEST_URI} !~ m#^/(embed(/|$)|api/|ws|whep/|hls/)#"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" "expr=%{REQUEST_URI} =~ m#^/embed(/|$)#"

    # --- Reverse proxy ke service Docker (semua hanya di 127.0.0.1) ---
    ProxyPreserveHost On
    ProxyRequests Off

    # mod_alias bawaan Debian memetakan /icons/ ke /usr/share/apache2/icons
    # (berlaku global) dan menimpa out/icons/ PWA -> icon.svg 404.
    Alias /icons/ /var/www/netravision/out/icons/

    # API FastAPI
    ProxyPass        /api/ http://127.0.0.1:8100/api/
    ProxyPassReverse /api/ http://127.0.0.1:8100/api/

    # WebSocket FastAPI (status kamera, alert) — butuh proxy_wstunnel
    ProxyPass        /ws ws://127.0.0.1:8100/ws
    ProxyPassReverse /ws ws://127.0.0.1:8100/ws

    # Sinyal WebRTC/WHEP via proxy media ber-auth (K-1): API memvalidasi
    # kredensial dulu baru meneruskan ke MediaMTX. JANGAN proxy langsung
    # ke MediaMTX, itu celah live stream tanpa auth.
    ProxyPass        /whep/ http://127.0.0.1:8100/api/media/whep/
    ProxyPassReverse /whep/ http://127.0.0.1:8100/api/media/whep/

    # Fallback HLS via proxy media ber-auth (K-1): sama seperti /whep/.
    ProxyPass        /hls/ http://127.0.0.1:8100/api/media/hls/
    ProxyPassReverse /hls/ http://127.0.0.1:8100/api/media/hls/
    # MediaMTX mengirim Location relatif ke root (/path/...) — kembalikan
    # awalan /hls/ agar redirect tidak lepas dari proxy.
    <Location /hls/>
        Header edit Location ^/(?!hls/) /hls/
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/netravision_ssl_error.log
    # 4.5: token JANGAN PERNAH tercatat di log akses. Path yang membawa
    # kredensial di query string (?token= JWT akses penuh untuk /ws,
    # ?session= token sesi embed untuk /whep, ?key=/ ?pass= untuk
    # /api/external) dicatat TANPA query string (format noquery: method
    # + path + protokol, tanpa %q). Path lain tetap memakai combined
    # (dengan query) supaya debugging biasa tidak kehilangan info.
    # SetEnvIf di sini memakai REQUEST_URI (path + query); dua CustomLog
    # di bawah saling lepas (env= / env=!): tiap request hanya masuk
    # satu file baris.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" noquery
    SetEnvIf Request_URI "^/(api/posters/|api/ad-config|ws|whep/|hls/|api/external/)" noquery
    CustomLog ${APACHE_LOG_DIR}/netravision_ssl_access.log noquery env=noquery
    CustomLog ${APACHE_LOG_DIR}/netravision_ssl_access.log combined env=!noquery
</VirtualHost>
