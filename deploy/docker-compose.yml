# NetraVision v3.0, docker-compose
#
# ATURAN KERAS (keputusan 2026-11-02):
# - Port 80 dan 443 tetap milik Apache (banyak virtualhost). TIDAK ADA service
#   yang bind 80/443 di sini.
# - Semua port TCP di-publish HANYA ke 127.0.0.1; Apache me-reverse-proxy
#   /api/*, /ws, /whep/*, /hls/* ke service yang relevan.
# - PENGECUALIAN: UDP 8189 (media WebRTC) di-publish ke host karena browser
#   pengguna harus bisa menjangkaunya langsung. Ini tidak bentrok dengan 80/443.
#
# Cara pakai:
#   cd <repo> && ./deploy/install.sh   (instalasi / setup awal, idempoten)
#   ./deploy/update.sh                  (update: git pull + build + migrasi)

name: netravision

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netravision}
      POSTGRES_USER: ${POSTGRES_USER:-netravision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netravision} -d ${POSTGRES_DB:-netravision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netravision
    # TIDAK ada ports: hanya diakses dari dalam network oleh service api.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # G-R5: password internal (tidak ada port yang di-publish, tapi auth
    # tetap diberlakukan sebagai pertahanan berlapis).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD belum di-set di deploy/.env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netravision
    # TIDAK ada ports: hanya diakses dari dalam network oleh service api.

  # Migrasi DB jalan dulu sebelum API (hindari "relation does not exist").
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netravision}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set}@postgres:5432/${POSTGRES_DB:-netravision}
    working_dir: /srv/api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netravision

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netravision}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set}@postgres:5432/${POSTGRES_DB:-netravision}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEDIAMTX_API_URL: http://mediamtx:9997
      # B-K1: samakan dengan recordPath MediaMTX (/recordings) + volume recordings.
      RECORDINGS_DIR: /recordings
      # B-T4: staging folder-link rclone (volume gdrive_staging, persisten).
      GDRIVE_RECORD_PATH: /mnt/gdrive
    ports:
      # Hanya localhost, Apache mem-proxy /api/* dan /ws ke sini.
      # G-S1: API_PORT benar-benar dipakai (default 8100).
      - "127.0.0.1:${API_PORT:-8100}:8000"
    volumes:
      # B-K1/B-T6: read-write (bukan :ro) agar retensi API bisa menghapus.
      - recordings:/recordings
      # B-T4: data API persisten (.rclone.conf, token Drive, dsb.) supaya
      # tidak hilang saat container dibuat ulang.
      - apidata:/srv/api/data
      - gdrive_staging:/mnt/gdrive
      # Rekaman multi-disk: disk tambahan harus di-mount di service ini DAN
      # di mediamtx dengan path yang sama, supaya record_disk kamera bisa
      # menunjuk ke sana. Hapus tanda # di baris bawah untuk mengaktifkan.
      # - /mnt/cctv-storage:/mnt/cctv-storage  # disk tambahan untuk record_disk (samakan path di host dan container)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - netravision

  mediamtx:
    # Varian -ffmpeg: sub stream ditranskode ffmpeg di dalam container (v2).
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    environment:
      # M1: IP/domain publik server untuk kandidat ICE WebRTC, diisi dari
      # deploy/.env (WEBRTC_ADDITIONAL_HOST). Compose gagal dengan pesan jelas
      # bila belum di-set; JANGAN tulis IP hardcoded di mediamtx.yml.
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOST:?WEBRTC_ADDITIONAL_HOST belum di-set di deploy/.env - isi IP/domain publik server}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
      # Rekaman multi-disk: disk tambahan harus di-mount di service ini DAN
      # di api dengan path yang sama, supaya record_disk kamera bisa
      # menunjuk ke sana. Hapus tanda # di baris bawah untuk mengaktifkan.
      # - /mnt/cctv-storage:/mnt/cctv-storage  # disk tambahan untuk record_disk (samakan path di host dan container)
    ports:
      # Sinyal/kontrol, hanya localhost, Apache mem-proxy yang perlu diekspos.
      - "127.0.0.1:8554:8554"   # RTSP (debug / kamera lokal)
      - "127.0.0.1:8888:8888"   # HLS  (Apache proxy /hls/* ke sini)
      - "127.0.0.1:8889:8889"   # WebRTC/WHEP signaling HTTP (Apache proxy /whep/* ke sini)
      - "127.0.0.1:9997:9997"   # control API (dipakai service api via network; publish lokal utk debug)
      # PENGECUALIAN: media WebRTC (UDP) harus terjangkau browser pengguna.
      - "8189:8189/udp"         # WebRTC UDP (default MediaMTX), bukan 80/443, aman.
    # G-R3: TIDAK ADA healthcheck di sini dengan sengaja. Image resmi
    # MediaMTX (scratch + ffmpeg) tidak punya shell/curl, jadi healthcheck
    # lama ("/mediamtx --help", selalu exit 0) berbohong: container
    # dilaporkan healthy padahal media mati. Liveness MediaMTX yang benar
    # dipantau lewat /api/health service api (yang memeriksa control API
    # MediaMTX dan hanya "ok" bila 2xx), dan healthcheck api berjalan tiap
    # 15 detik. Jangan tambahkan lagi healthcheck --help di sini.
    networks:
      - netravision

networks:
  netravision:
    driver: bridge

volumes:
  pgdata:
    name: netravision_pgdata
  redisdata:
    name: netravision_redisdata
  recordings:
    name: netravision_recordings
  apidata:
    name: netravision_apidata
  gdrive_staging:
    name: netravision_gdrive_staging
