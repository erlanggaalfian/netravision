# NetraVision v3.0, docker-compose
#
# ATURAN KERAS (keputusan 2026-11-02):
# - Port 80 dan 443 tetap milik Apache (banyak virtualhost). TIDAK ADA service
#   yang bind 80/443 di sini.
# - Semua port TCP di-publish HANYA ke 127.0.0.1; Apache me-reverse-proxy
#   /api/*, /ws, /whep/*, /hls/* ke service yang relevan.
# - PENGECUALIAN: UDP 8189 (media WebRTC) di-publish ke host karena browser
#   pengguna harus bisa menjangkaunya langsung. Ini tidak bentrok dengan 80/443.
#
# Cara pakai:
#   cd <repo> && ./deploy/install.sh   (instalasi / setup awal, idempoten)
#   ./deploy/update.sh                  (update: git pull + build + migrasi)

name: netravision

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netravision}
      POSTGRES_USER: ${POSTGRES_USER:-netravision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set di deploy/.env}
    volumes:
      # JANGAN ubah ke /var/lib/postgresql/data: instalasi lama menyimpan
      # data di <volume>/data (PGDATA default image). Mengubah mount akan
      # membuat volume lama yatim dan database tampak kosong.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netravision} -d ${POSTGRES_DB:-netravision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netravision
    # TIDAK ada ports: hanya diakses dari dalam network oleh service api.

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.1", memory: 64M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    # G-R5: password internal (tidak ada port yang di-publish, tapi auth
    # tetap diberlakukan sebagai pertahanan berlapis).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD belum di-set di deploy/.env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netravision
    # TIDAK ada ports: hanya diakses dari dalam network oleh service api.

  # Migrasi DB jalan dulu sebelum API (hindari "relation does not exist").
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    # One-shot dan tepercaya (menjalankan alembic + menulis mediamtx.yml
    # ke bind-mount host): sengaja tetap root. API (long-running) justru
    # berjalan non-root (user 10001, lihat service api).
    user: "0:0"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netravision}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set}@postgres:5432/${POSTGRES_DB:-netravision}
      PYTHONPATH: /srv/api
    working_dir: /srv/api
    # Setelah migrasi, hasilkan deploy/mediamtx.yml dari template
    # dengan password dari database (app/db/setup_mediamtx.py).
    # Volume DIPERSEMPIT (dulu ./:/deploy:rw, seluruh deploy/ termasuk
    # .env berisi semua secret): hanya dua file yang dibutuhkan.
    # - template: read-only. - mediamtx.yml: read-write (output).
    # PERINGATAN bind-mount file: bila deploy/mediamtx.yml belum ada di
    # host, Docker membuatnya sebagai DIREKTORI dan setup_mediamtx gagal.
    # install.sh / update.sh membuat file itu dulu (touch + chmod 600).
    volumes:
      - ./mediamtx.yml.template:/deploy/mediamtx.yml.template:ro
      - ./mediamtx.yml:/deploy/mediamtx.yml:rw
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.setup_mediamtx /deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netravision

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Non-root (uid 10001 = user `netra` di Dockerfile). Volume recordings/
    # apidata/gdrive_staging harus dimiliki uid ini, deploy/install.sh dan
    # deploy/update.sh menjalankan deploy/fix-volume-perms.sh setelah up.
    user: "10001:10001"
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      # APP_ENV default prod bila tidak ada di .env: guard JWT_SECRET di
      # app/core/config.py hanya menolak secret default bila APP_ENV=prod.
      # Nilai dari deploy/.env (bila ada) tetap menang atas default ini.
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netravision}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set}@postgres:5432/${POSTGRES_DB:-netravision}
      PYTHONPATH: /srv/api
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEDIAMTX_API_URL: http://mediamtx:9997
      # Password control API MediaMTX dibaca dari DATABASE
      # (system_settings, di-cache saat startup); env ini hanya
      # fallback bila cache kosong. JANGAN wajibkan di .env lagi.
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-netravision}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:-}
      # 4.8: proxy tepercaya eksplisit untuk X-Forwarded-For. API hanya
      # mempercayai loopback + CIDR ini; jaringan Docker (gateway
      # 172.16.0.0/12) harus ada di sini supaya IP asli dari Apache
      # (host) tetap terbaca sebagai kunci rate limit/audit, bukan IP
      # gateway Docker yang dipakai semua klien bersama.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # B-K1: samakan dengan recordPath MediaMTX (/recordings) + volume recordings.
      RECORDINGS_DIR: /recordings
      # B-T4: staging folder-link rclone (volume gdrive_staging, persisten).
      GDRIVE_RECORD_PATH: /mnt/gdrive
    ports:
      # Hanya localhost, Apache mem-proxy /api/* dan /ws ke sini.
      # G-S1: API_PORT benar-benar dipakai (default 8100).
      - "127.0.0.1:${API_PORT:-8100}:8000"
      # Port 53682 untuk `rclone authorize` (Hubungkan Google): rclone
      # hanya listen di 127.0.0.1 di dalam container, API menjalankan
      # proxy TCP di IP container:53682 (authorize_proxy_loop) supaya
      # SSH forward ke host:53682 sampai ke rclone. Hanya localhost.
      - "127.0.0.1:53682:53682"
    volumes:
      # B-K1/B-T6: read-write (bukan :ro) agar retensi API bisa menghapus.
      - recordings:/recordings
      # B-T4: data API persisten (.rclone.conf, token Drive, dsb.) supaya
      # tidak hilang saat container dibuat ulang.
      - apidata:/srv/api/data
      - gdrive_staging:/mnt/gdrive
      # Rekaman multi-disk: disk tambahan harus di-mount di service ini DAN
      # di mediamtx dengan path yang sama, supaya record_disk kamera bisa
      # menunjuk ke sana. Hapus tanda # di baris bawah untuk mengaktifkan.
      # - /mnt/cctv-storage:/mnt/cctv-storage  # disk tambahan untuk record_disk (samakan path di host dan container)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - netravision

  mediamtx:
    # Varian -ffmpeg: sub stream ditranskode ffmpeg di dalam container (v2).
    # Di-pin ke 1.21.4-ffmpeg (terverifikasi ada di Docker Hub, 2026-11-18).
    # JANGAN pakai latest-ffmpeg: pull di lain waktu bisa menarik mayor baru.
    # Daftar versi yang dipakai ada di deploy/VERSIONS.md.
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      # TZ: zona waktu container ikut WIB supaya timestamp log dan
      # rekaman mediamtx benar. Patch ini dulu hanya ada di file server
      # dan hilang tertimpa deploy (rsync), jadi dipindah ke repo.
      TZ: Asia/Jakarta
      # M1: IP/domain publik server untuk kandidat ICE WebRTC, diisi dari
      # deploy/.env (WEBRTC_ADDITIONAL_HOST). Compose gagal dengan pesan jelas
      # bila belum di-set; JANGAN tulis IP hardcoded di mediamtx.yml.
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOST:?WEBRTC_ADDITIONAL_HOST belum di-set di deploy/.env - isi IP/domain publik server}
      # Password control API TIDAK lagi lewat env: mediamtx.yml
      # dihasilkan service `migrate` dari template dengan password
      # dari database (lihat mediamtx.yml.template). MediaMTX tidak
      # mengembangkan ${VAR} di yml, jadi env di sini tidak berguna.
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
      # Zona waktu host supaya TZ di atas benar-benar terbaca (image
      # mediamtx minimal, tidak membawa database zona waktu sendiri).
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      # Rekaman multi-disk: disk tambahan harus di-mount di service ini DAN
      # di api dengan path yang sama, supaya record_disk kamera bisa
      # menunjuk ke sana. Hapus tanda # di baris bawah untuk mengaktifkan.
      # - /mnt/cctv-storage:/mnt/cctv-storage  # disk tambahan untuk record_disk (samakan path di host dan container)
    ports:
      # Sinyal/kontrol, hanya localhost, Apache mem-proxy yang perlu diekspos.
      - "127.0.0.1:8554:8554"   # RTSP (debug / kamera lokal)
      - "127.0.0.1:8888:8888"   # HLS  (Apache proxy /hls/* ke sini)
      - "127.0.0.1:8889:8889"   # WebRTC/WHEP signaling HTTP (Apache proxy /whep/* ke sini)
      # 4.11: port control API 9997 TIDAK LAGI di-publish ke host.
      # Service api menjangkaunya via network Docker (mediamtx:9997);
      # publish lokal hanya memberi permukaan serangan tambahan.
      # PENGECUALIAN: media WebRTC (UDP) harus terjangkau browser pengguna.
      # PENGECUALIAN: media WebRTC (UDP) harus terjangkau browser pengguna.
      - "8189:8189/udp"         # WebRTC UDP (default MediaMTX), bukan 80/443, aman.
    # G-R3: TIDAK ADA healthcheck di sini dengan sengaja. Image resmi
    # MediaMTX (scratch + ffmpeg) tidak punya shell/curl, jadi healthcheck
    # lama ("/mediamtx --help", selalu exit 0) berbohong: container
    # dilaporkan healthy padahal media mati. Liveness MediaMTX yang benar
    # dipantau lewat /api/health service api (yang memeriksa control API
    # MediaMTX dan hanya "ok" bila 2xx), dan healthcheck api berjalan tiap
    # 15 detik. Jangan tambahkan lagi healthcheck --help di sini.
    # Pemeriksaan eksternal dari host (bukan healthcheck compose):
    #   python3 scripts/smoke_test.py --check-mediamtx
    # (TCP connect ke 8888/9997; liveness penuh tetap via /api/health).
    networks:
      - netravision

networks:
  netravision:
    driver: bridge

volumes:
  pgdata:
    name: netravision_pgdata
  redisdata:
    name: netravision_redisdata
  recordings:
    name: netravision_recordings
  apidata:
    name: netravision_apidata
  gdrive_staging:
    name: netravision_gdrive_staging
