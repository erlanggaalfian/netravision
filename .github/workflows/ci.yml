# NetraVision v3.0 — CI
# Trigger: setiap push & pull_request.
# Aturan: push != deploy. CI hanya verifikasi; deploy via deploy/update.sh manual.

name: CI

on:
  push:
  pull_request:

jobs:
  api-lint:
    name: API lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check apps/api
      - run: ruff format --check apps/api

  api-typecheck:
    name: API typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy sqlalchemy pydantic
      - run: mypy apps/api

  api-test:
    name: API test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: netravision_test
          POSTGRES_USER: netravision
          POSTGRES_PASSWORD: test_only_ci
        options: >-
          --health-cmd "pg_isready -U netravision -d netravision_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://netravision:test_only_ci@localhost:5432/netravision_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r apps/api/requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: cd apps/api && alembic upgrade head
      - run: cd apps/api && pytest -q

  web-build:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run lint --if-present
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npm run build
