# Konfigurasi Alembic NetraVision v3.0.
[alembic]
script_location = alembic
# URL diambil dari settings aplikasi di env.py (DATABASE_URL); ini fallback.
sqlalchemy.url = postgresql+asyncpg://netravision:netravision@127.0.0.1:5432/netravision

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
